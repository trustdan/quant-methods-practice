name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate documentation scaffold
        run: python scripts/validate_scaffold.py

      - name: Go formatting
        run: diff -u <(echo -n) <(gofmt -d cmd internal)

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Frontend typecheck
        working-directory: web
        run: npm run typecheck

      - name: Frontend lint
        working-directory: web
        run: npm run lint

      - name: Frontend unit tests
        working-directory: web
        run: npm run test

      - name: Build frontend production assets
        working-directory: web
        run: npm run build

      - name: Go vet
        run: go vet ./internal/... ./cmd/...

      - name: Go unit tests
        run: go test -v ./internal/... ./cmd/...

      - name: Compile Go binary
        run: go build -o bin/quant-practice ./cmd/quant-practice
